<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>귀선의 Fun Run 기록</title>
<meta name="description" content="힘들어도 미소를 잃지 않는 내가 일류">

<!-- 이모지를 SVG 파비콘으로 넣으면 브라우저 파비콘 렌더러가 컬러 이모지
     폰트를 못 써서 기본 아이콘(지구본)이 뜬다. 미리 구운 PNG 를 쓴다. -->
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- 공유 미리보기. og:image 는 크롤러가 상대경로를 못 읽어서 절대주소로 둔다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FUN RUN">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="귀선의 Fun Run 기록">
<meta property="og:description" content="힘들어도 미소를 잃지 않는 내가 일류">
<meta property="og:url" content="https://kwiseon.github.io/funrun/">
<meta property="og:image" content="https://kwiseon.github.io/funrun/images/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="성곽길을 웃으며 달리는 모습">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="귀선의 Fun Run 기록">
<meta name="twitter:description" content="힘들어도 미소를 잃지 않는 내가 일류">
<meta name="twitter:image" content="https://kwiseon.github.io/funrun/images/og.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ══════════════════════════════ HERO ══════════════════════════════ -->
<header class="hero">
  <div class="hero__grain" aria-hidden="true"></div>
  <canvas class="hero__tracks" aria-hidden="true"></canvas>

  <div class="hero__inner">
    <p class="hero__eyebrow">FUN RUN — RUNNING ARCHIVE</p>

    <p class="hero__period" data-period>—</p>

    <h1 class="hero__figure">
      <span class="hero__km" data-total-km>0</span><span class="hero__unit">KM</span>
    </h1>

    <div class="monthbar" data-monthbar aria-label="월별 달린 거리"></div>

    <dl class="hero__stats">
      <div><dt>RACES</dt><dd data-race-count>0</dd></div>
      <div><dt>MEDALS</dt><dd data-medal-count>0</dd></div>
      <div><dt>GPX RUNS</dt><dd data-run-count>0</dd></div>
      <div><dt>COURSES</dt><dd data-course-count>0</dd></div>
    </dl>

    <p class="hero__note" data-excluded-note hidden></p>
  </div>

  <div class="hero__scroll" aria-hidden="true"><span>SCROLL</span></div>
</header>

<!-- ══════════════════════════════ MEDALS ══════════════════════════════ -->
<section class="section section--medals" id="medals">
  <div class="section__head reveal">
    <p class="section__index">01</p>
    <h2 class="section__title">MEDAL<br>WALL</h2>
    <p class="section__desc">완주하고 목에 걸었던 것들. <span data-medal-years></span></p>
  </div>

  <div class="medalrail reveal">
    <div class="medalrail__scroll" data-medal-wall tabindex="0"
         aria-label="메달 목록, 좌우로 스크롤"></div>
    <p class="medalrail__hint">← 옆으로 밀어보세요 →</p>
  </div>
</section>

<!-- ══════════════════════════════ SHOES ══════════════════════════════ -->
<section class="section section--shoes" id="shoes">
  <div class="section__head reveal">
    <p class="section__index">02</p>
    <h2 class="section__title">SHOE<br>RACK</h2>
    <p class="section__desc">
      귀선과 함께한 신발들. 거리는 <b>GPX 기록이 남아있는 러닝만</b> 합산.
    </p>
  </div>

  <div class="rack reveal" data-shoe-rack></div>
</section>

<!-- ══════════════════════════════ MAP ══════════════════════════════ -->
<section class="section section--map" id="map">
  <div class="section__head reveal">
    <p class="section__index">03</p>
    <h2 class="section__title">SEOUL<br>ROUTES</h2>
    <p class="section__desc">
      귀선이 달린 코스들. 선에 마우스를 올리면 자세히 볼 수 있어요.
    </p>
  </div>

  <div class="maparea">
    <div class="maparea__canvas" id="leaflet"></div>

    <div class="legend">
      <span class="legend__item"><i class="legend__line legend__line--normal"></i>일반 코스</span>
      <span class="legend__item"><i class="legend__line legend__line--race"></i>🏅 대회 코스</span>
      <span class="legend__hint">선 굵기 = 달린 횟수</span>
    </div>

    <aside class="panel" data-panel>
      <div class="panel__empty" data-panel-empty>
        <p class="panel__emptyicon">↖</p>
        <p>지도 위의 코스를 짚어보세요</p>
      </div>
      <div class="panel__body" data-panel-body hidden></div>
    </aside>

    <ol class="courselist" data-course-list aria-label="코스 목록"></ol>
  </div>
</section>

<footer class="foot">
  <p class="foot__mark">FUN RUN</p>
  <p class="foot__meta" data-generated></p>
</footer>

<!-- 서버 없이 file:// 로 열면 fetch 가 막힌다. 그때 쓰는 데이터 사본. -->
<script src="data/bundle.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
